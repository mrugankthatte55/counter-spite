<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter Spite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;1,800;1,900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --accent: #c6ff3a;
        --accent-dim: #7fa51f;
        --bg: #090b07;
        --panel: rgba(10, 13, 8, 0.72);
        --text: #e9ece4;
        --muted: rgba(233, 236, 228, 0.55);
        --line: rgba(255, 255, 255, 0.09);
        --cond: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
        --body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--body); color: var(--text); user-select: none; }
      canvas.game { display: block; }
      button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
      .hidden { display: none !important; }

      /* ---------- HUD ---------- */
      #hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--cond); }
      .hud-panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); backdrop-filter: blur(6px); }

      #crosshair { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); }
      #crosshair::before, #crosshair::after { content: ""; position: absolute; background: var(--accent); box-shadow: 0 0 2px #000, 0 0 1px #000; }
      #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
      #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
      #crosshair .dot { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); background: transparent; box-shadow: inset 0 0 0 10px var(--bg); opacity: 0; }
      #crosshair .gap { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; transform: translate(-50%, -50%); background: var(--bg); opacity: 0; }
      #hitmarker { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%) rotate(45deg); opacity: 0; transition: opacity 0.08s; }
      #hitmarker::before, #hitmarker::after { content: ""; position: absolute; background: #fff; }
      #hitmarker::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
      #hitmarker::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
      #hitmarker.kill::before, #hitmarker.kill::after { background: var(--accent); }
      #damage { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 45%, rgba(200,0,0,0.55) 100%); opacity: 0; transition: opacity 0.1s; }
      #scope { position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(0,0,0,0) 0, rgba(0,0,0,0) 32vmin, rgba(0,0,0,0.97) 33vmin); }
      #scope::before, #scope::after { content: ""; position: absolute; background: rgba(0,0,0,0.85); }
      #scope::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
      #scope::after { top: 50%; left: 0; height: 1px; width: 100%; transform: translateY(-50%); }

      /* top center scoreboard */
      #score { top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; border-left: 1px solid var(--line); border-top: 2px solid var(--accent); }
      #score > div { padding: 6px 16px; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
      #score .team { min-width: 92px; }
      #score .team small { font-size: 11px; letter-spacing: 2px; opacity: 0.6; font-weight: 500; }
      #score .team.ct { justify-content: flex-end; }
      #score .team span { color: var(--accent); font-size: 26px; }
      #score .timer { background: rgba(0,0,0,0.35); font-weight: 500; font-size: 20px; letter-spacing: 1px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
      #score .timer.low { color: #ff5252; }

      /* minimap */
      #minimapWrap { top: 14px; left: 14px; padding: 4px; }
      #minimap { display: block; width: 176px; height: 176px; }
      #minimapWrap .label { position: absolute; left: 8px; bottom: 6px; font-size: 10px; letter-spacing: 3px; opacity: 0.55; }

      /* kill feed */
      #killfeed { position: absolute; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
      #killfeed .row { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      #killfeed .row.you { border-right: 3px solid var(--accent); }
      #killfeed .row.victim { border-right: 3px solid #ff5252; }
      #killfeed .you-name { color: var(--accent); }
      #killfeed .bot { color: #fff; }
      #killfeed svg { height: 14px; width: auto; fill: var(--muted); }
      #killfeed .hs svg.head { fill: var(--accent); }

      /* bottom-left vitals */
      #vitals { left: 14px; bottom: 14px; display: flex; gap: 0; border-left: none; background: none; border: none; backdrop-filter: none; }
      #vitals .pill { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 6px 16px 6px 12px; margin-right: 6px; backdrop-filter: blur(6px); min-width: 120px; }
      #vitals .pill svg { width: 18px; height: 18px; fill: var(--accent); }
      #vitals .pill span { font-size: 30px; font-weight: 700; line-height: 1; }
      #vitals .pill.low { border-left-color: #ff5252; }
      #vitals .pill.low span { color: #ff5252; }
      #vitals .pill.low svg { fill: #ff5252; }

      /* bottom-right weapons + ammo */
      #weapons { position: absolute; right: 14px; bottom: 74px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
      #weapons .slot { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; min-width: 150px; opacity: 0.5; border-right: 3px solid transparent; }
      #weapons .slot.active { opacity: 1; border-right-color: var(--accent); }
      #weapons .slot svg { height: 16px; width: 56px; fill: var(--muted); }
      #weapons .slot.active svg { fill: var(--accent); }
      #weapons .slot .key { font-size: 11px; opacity: 0.6; min-width: 10px; }
      #weapons .slot .name { font-size: 15px; font-weight: 700; letter-spacing: 1px; flex: 1; text-align: right; }
      #ammo { right: 14px; bottom: 14px; display: flex; align-items: baseline; gap: 6px; padding: 4px 16px; border-left: none; border-right: 3px solid var(--accent); }
      #ammo .mag { font-size: 34px; font-weight: 700; line-height: 1; }
      #ammo .sep { font-size: 18px; opacity: 0.5; }
      #ammo .reserve { font-size: 18px; opacity: 0.75; }
      #ammo .state { font-size: 11px; letter-spacing: 2px; color: var(--accent); margin-left: 8px; }

      #message { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); font-size: 52px; font-weight: 900; font-style: italic; letter-spacing: 3px; text-shadow: 0 2px 16px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.2s; text-align: center; color: #fff; }
      #message em { color: var(--accent); font-style: inherit; }
      #message small { display: block; font-size: 16px; font-weight: 500; font-style: normal; letter-spacing: 3px; opacity: 0.8; margin-top: 6px; }
      #fps { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: 0.45; font-family: monospace; }

      /* ---------- MENU ---------- */
      #menu { position: fixed; inset: 0; z-index: 10; font-family: var(--cond);
        background:
          repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 12px),
          radial-gradient(circle at 74% 55%, transparent 0 18vmin, rgba(255,255,255,0.05) 18vmin, transparent calc(18vmin + 1px), transparent 30vmin, rgba(255,255,255,0.045) 30vmin, transparent calc(30vmin + 1px), transparent 44vmin, rgba(255,255,255,0.04) 44vmin, transparent calc(44vmin + 1px)),
          linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 90%, transparent) 34%, color-mix(in srgb, var(--bg) 18%, transparent) 62%, color-mix(in srgb, var(--bg) 30%, transparent) 100%);
      }
      #menu::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px rgba(0,0,0,0.6); }
      .menu-left { position: absolute; left: 6vw; top: 9vh; bottom: 8vh; display: flex; flex-direction: column; width: min(420px, 60vw); }
      .wordmark { display: flex; flex-direction: column; line-height: 0.82; font-style: italic; font-weight: 900; letter-spacing: -1px; transform: skewX(-8deg); filter: drop-shadow(0 4px 0 rgba(0,0,0,0.6)) drop-shadow(0 0 24px color-mix(in srgb, var(--accent) 25%, transparent)); }
      .wordmark .w1 { font-size: clamp(56px, 9vw, 96px); color: #fff; }
      .wordmark .w2 { font-size: clamp(56px, 9vw, 96px); color: var(--accent); margin-left: 0.55em; }
      .tagline { margin-top: 18px; font-size: 13px; letter-spacing: 5px; color: var(--muted); font-weight: 500; }
      .tagline b { color: var(--accent); font-weight: 700; }
      .stack { margin-top: 42px; display: flex; flex-direction: column; gap: 8px; width: 240px; }
      .stack button { text-align: left; padding: 11px 18px; font-size: 20px; font-weight: 700; letter-spacing: 3px; border: 1px solid var(--line); border-left: 3px solid var(--accent-dim); background: rgba(0,0,0,0.35); transition: background 0.12s, border-color 0.12s, transform 0.12s; }
      .stack button:hover, .stack button.active { background: color-mix(in srgb, var(--accent) 16%, rgba(0,0,0,0.4)); border-left-color: var(--accent); transform: translateX(4px); }
      .stack button.primary { background: var(--accent); color: #000; border-left-color: #fff; }
      .stack button.primary:hover { background: color-mix(in srgb, var(--accent) 85%, #fff); }
      .session { margin-top: auto; font-size: 13px; letter-spacing: 2px; color: var(--muted); }
      .session b { color: var(--text); font-weight: 700; }
      .menu-topright { position: absolute; top: 24px; right: 28px; }
      .pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 12px 8px 14px; font-size: 12px; letter-spacing: 2px; font-weight: 700; border: 1px solid var(--line); background: rgba(0,0,0,0.45); }
      .pill:hover { border-color: var(--accent); }
      .pill .swatch { width: 12px; height: 12px; background: var(--accent); }
      .menu-bottomright { position: absolute; right: 28px; bottom: 28px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
      .util { display: inline-block; padding: 8px 18px; min-width: 130px; text-align: center; font-size: 12px; letter-spacing: 2px; font-weight: 700; border: 1px solid var(--line); background: rgba(0,0,0,0.45); text-decoration: none; color: inherit; }
      .util:hover { border-color: var(--accent); color: var(--accent); }
      .menu-version { position: absolute; left: 6vw; bottom: 22px; font-size: 11px; letter-spacing: 2px; color: var(--muted); }

      /* modal panel */
      #panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, 92vw); max-height: 84vh; overflow: auto; background: color-mix(in srgb, var(--bg) 88%, #000); border: 1px solid var(--line); border-top: 3px solid var(--accent); padding: 26px 30px 30px; box-shadow: 0 30px 80px rgba(0,0,0,0.7); font-family: var(--body); }
      #panel h2 { font-family: var(--cond); font-style: italic; font-weight: 900; font-size: 36px; letter-spacing: 2px; margin-bottom: 4px; }
      #panel h2 em { color: var(--accent); font-style: inherit; }
      #panel .sub { font-family: var(--cond); font-size: 12px; letter-spacing: 3px; color: var(--muted); margin-bottom: 20px; }
      #panel .close { position: absolute; top: 14px; right: 14px; font-family: var(--cond); font-size: 12px; letter-spacing: 2px; padding: 6px 12px; border: 1px solid var(--line); }
      #panel .close:hover { border-color: var(--accent); color: var(--accent); }
      .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .card { border: 1px solid var(--line); background: rgba(255,255,255,0.03); padding: 16px; cursor: pointer; position: relative; }
      .card:hover { border-color: var(--accent-dim); }
      .card.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
      .card.selected::after { content: "EQUIPPED"; position: absolute; top: 10px; right: 10px; font-family: var(--cond); font-size: 10px; letter-spacing: 2px; color: #000; background: var(--accent); padding: 2px 6px; }
      .card svg { width: 100%; height: 56px; fill: var(--text); }
      .card.selected svg { fill: var(--accent); }
      .card h3 { font-family: var(--cond); font-size: 22px; font-weight: 700; letter-spacing: 2px; margin: 8px 0 2px; }
      .card .desc { font-size: 12px; color: var(--muted); margin-bottom: 10px; min-height: 30px; }
      .stat { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; font-family: var(--cond); font-size: 11px; letter-spacing: 2px; color: var(--muted); margin: 4px 0; }
      .stat .bar { height: 5px; background: rgba(255,255,255,0.08); }
      .stat .bar i { display: block; height: 100%; background: var(--accent); }
      .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
      .kv div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 14px; }
      .kv div b { font-family: var(--cond); font-size: 20px; color: var(--accent); }
      .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; font-size: 14px; }
      .keys div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 7px 0; }
      .keys kbd { font-family: var(--cond); font-weight: 700; letter-spacing: 1px; background: rgba(255,255,255,0.08); padding: 1px 8px; border: 1px solid var(--line); }
      .setting { display: grid; grid-template-columns: 180px 1fr 60px; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
      .setting label { font-family: var(--cond); letter-spacing: 2px; font-size: 13px; }
      .setting input[type=range] { width: 100%; accent-color: var(--accent); }
      .setting select { background: #0e1110; color: var(--text); border: 1px solid var(--line); padding: 6px 10px; font: inherit; }
      .setting .val { font-family: var(--cond); text-align: right; color: var(--accent); font-size: 16px; }
      .swatches { display: flex; gap: 8px; }
      .swatches button { width: 34px; height: 24px; border: 2px solid transparent; }
      .swatches button.selected { border-color: #fff; }
      .panel-actions { margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }
      .btn { font-family: var(--cond); font-size: 15px; font-weight: 700; letter-spacing: 3px; padding: 10px 22px; border: 1px solid var(--line); }
      .btn.primary { background: var(--accent); color: #000; }
      .btn:hover { border-color: var(--accent); }

      @media (max-width: 720px) {
        .menu-left { left: 20px; width: calc(100vw - 40px); }
        .menu-topright { top: 12px; right: 12px; }
        .menu-bottomright { right: 12px; bottom: 12px; }
        .cards, .kv, .keys { grid-template-columns: 1fr; }
        #minimapWrap { display: none; }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <symbol id="ic-rifle" viewBox="0 0 64 20">
          <path d="M1 8h6l1-2h6V4h4v2h14l1-2h12l1 2h17v4h-5l-1 3h-5l1-3H36l-2 7h-6l1-7h-6l-3 3h-5l1-3H8l-1 2H1z"/>
        </symbol>
        <symbol id="ic-pistol" viewBox="0 0 64 20">
          <path d="M14 3h36v7h-5l-1-2H30l-2 9h-9l1-9h-6z"/>
        </symbol>
        <symbol id="ic-sniper" viewBox="0 0 64 20">
          <path d="M20 2h16v4H20zM1 9h6l1-2h44l1 2h10v3h-6l-1 3h-5l1-3H30l-3 6h-5l2-6h-9l-1 2H1z"/>
        </symbol>
        <symbol id="ic-head" viewBox="0 0 20 20">
          <path d="M10 1a7 7 0 0 0-7 7c0 3 1.5 5 3 6v3h8v-3c1.5-1 3-3 3-6a7 7 0 0 0-7-7zm-3 8a1.6 1.6 0 1 1 0 .1zm6 0a1.6 1.6 0 1 1 0 .1z"/>
        </symbol>
        <symbol id="ic-health" viewBox="0 0 20 20"><path d="M7 2h6v5h5v6h-5v5H7v-5H2V7h5z"/></symbol>
        <symbol id="ic-armor" viewBox="0 0 20 20"><path d="M10 1l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V4z"/></symbol>
      </defs>
    </svg>

    <div id="menu">
      <div class="menu-left">
        <div class="wordmark"><span class="w1">COUNTER</span><span class="w2">SPITE</span></div>
        <div class="tagline"><b>ULTRA-VIOLENCE</b> TACTICAL &middot; ROUND-BASED FPS</div>
        <nav class="stack">
          <button class="primary" data-action="play" id="playBtn">PLAY</button>
          <button data-action="loadout">LOADOUT</button>
          <button data-action="rankings">RANKINGS</button>
          <button data-action="controls">CONTROLS</button>
        </nav>
        <div class="session" id="menuStats"></div>
      </div>
      <div class="menu-topright">
        <button class="pill" id="colorwayBtn"><span id="colorwayName">NEON LIME &amp; BLACK</span><span class="swatch"></span></button>
      </div>
      <div class="menu-bottomright">
        <button class="util" data-action="settings">SETTINGS</button>
        <a class="util" href="https://github.com/mrugankthatte55/counter-spite" target="_blank" rel="noopener">GITHUB</a>
      </div>
      <div class="menu-version">COUNTER SPITE &middot; ALPHA 0.2</div>
      <div id="panel" class="hidden"></div>
    </div>

    <div id="hud">
      <div id="damage"></div>
      <div id="scope" class="hidden"></div>
      <div id="crosshair"><div class="gap"></div></div>
      <div id="hitmarker"></div>
      <div id="fps"></div>
      <div id="score" class="hud-panel">
        <div class="team ct"><small>CT</small><span class="ct-score">0</span></div>
        <div class="timer">5:00</div>
        <div class="team t"><span class="t-score">0</span><small>T</small></div>
      </div>
      <div id="minimapWrap" class="hud-panel"><canvas id="minimap" width="176" height="176"></canvas><div class="label">RADAR</div></div>
      <div id="killfeed"></div>
      <div id="vitals" class="hud-panel">
        <div class="pill" id="healthPill"><svg><use href="#ic-health"/></svg><span class="value">100</span></div>
        <div class="pill" id="armorPill"><svg><use href="#ic-armor"/></svg><span class="value">100</span></div>
      </div>
      <div id="weapons"></div>
      <div id="ammo" class="hud-panel"><span class="mag">30</span><span class="sep">//</span><span class="reserve">90</span><span class="state"></span></div>
      <div id="message"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
